version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: purplle_backend_service
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - DB_PATH=data/store_intel.db
      - YOLO_MODEL=yolov8n.pt
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: purplle_dashboard_service
    ports:
      - "8501:8501"
    environment:
      # Directs Streamlit to fetch backend data via Docker internal network DNS routing
      - BACKEND_URL=http://backend:8000
    command: streamlit run app/dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      - backend
    restart: unless-stopped
